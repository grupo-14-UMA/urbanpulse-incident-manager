services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-urbanpulse}
      POSTGRES_USER: ${POSTGRES_USER:-urbanpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-urbanpulse}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    image: urbanpulse-incident-manager-backend
    build:
      context: ./src/backend
    environment:
      DB_HOST: db
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-urbanpulse}
      POSTGRES_USER: ${POSTGRES_USER:-urbanpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-urbanpulse}
      MANAGEMENT_PANEL_ORIGIN: ${MANAGEMENT_PANEL_ORIGIN:-http://localhost:${MANAGEMENT_PANEL_PORT:-8081}}
      SERVER_PORT: 8080
      PHOTOS_DIR: /var/lib/urbanpulse/photos
      # Development-only secret. A real deployment sets its own JWT_SECRET.
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-change-me-in-any-deployment}
      # Adds the seeded staff accounts (development only, never in a real deployment).
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration,classpath:db/dev-seed
    ports:
      - "${SERVER_PORT:-8080}:8080"
    volumes:
      - incident_photos:/var/lib/urbanpulse/photos
    depends_on:
      db:
        condition: service_healthy
      photo-storage-init:
        condition: service_completed_successfully

  photo-storage-init:
    image: urbanpulse-incident-manager-backend
    user: "0:0"
    entrypoint: ["/bin/sh", "-c", "mkdir -p /photos && chown 10001:0 /photos && chmod 750 /photos"]
    command: []
    volumes:
      - incident_photos:/photos
    restart: "no"

  panel:
    build:
      context: ./src/management-panel
    ports:
      - "${MANAGEMENT_PANEL_PORT:-8081}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  incident_photos:
