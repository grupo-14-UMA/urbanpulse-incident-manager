services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-urbanpulse}
      POSTGRES_USER: ${POSTGRES_USER:-urbanpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-urbanpulse}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./src/backend
    environment:
      DB_HOST: db
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-urbanpulse}
      POSTGRES_USER: ${POSTGRES_USER:-urbanpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-urbanpulse}
      SERVER_PORT: 8080
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
