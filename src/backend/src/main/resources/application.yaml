spring:
  application:
    name: urbanpulse-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:urbanpulse}
    username: ${POSTGRES_USER:urbanpulse}
    password: ${POSTGRES_PASSWORD:urbanpulse}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      # Keep a small transport margin so domain validation can return the API's 5 MB message.
      max-file-size: 6MB
      max-request-size: 25MB

server:
  port: ${SERVER_PORT:8080}

urbanpulse:
  cors:
    management-panel-origin: ${MANAGEMENT_PANEL_ORIGIN:http://localhost:5173}
  security:
    # Required, at least 32 bytes. No default on purpose: the backend does not start without it.
    jwt-secret: ${JWT_SECRET:}
  storage:
    photos-dir: ${PHOTOS_DIR:./data/photos}
