name: Management panel CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build management panel
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/management-panel/package-lock.json

      - name: Install dependencies
        working-directory: src/management-panel
        run: npm ci

      - name: Build management panel
        working-directory: src/management-panel
        run: npm run build
